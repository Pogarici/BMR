<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BMR App</title>

<style>

*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    padding:10px;
    display:flex;
    justify-content:center;
}

/* DARK MODE */
body.dark{
    background:#1c1c1c;
    color:#eee;
}

/* CONTAINER */

.container{
    width:100%;
    max-width:420px;
}

/* TITLE */

h2{
    text-align:center;
    margin-bottom:15px;
}

/* INPUTS */

.form-row{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:15px;
}

input,select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ccc;
}

/* BMR BOX */

.bmr-box{
    text-align:center;
    padding:20px;
    border-radius:16px;
    background:#fff;
    margin-bottom:10px;
}

body.dark .bmr-box{
    background:#2c2c2c;
}

.bmr-value{
    font-size:32px;
    font-weight:bold;
    color:#336699;
}

/* CARD */

.card{
    border-radius:16px;
    padding:15px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

/* TEXT INSIDE CARD */

.card-text{
    flex:1;
    font-size:13px;
}

.card-value{
    font-weight:bold;
    font-size:14px;
    text-align:right;
}

/* COLORS */

.row1{background:#FE7676}
.row2{background:#DAF2D0}
.row3{background:#B5E6A2}
.row4{background:#8ED973}
.row5{background:#8ED973}

/* BUTTONS */

.actions{
    display:flex;
    gap:10px;
    margin-top:10px;
}

button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#336699;
    color:white;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<h2>BMR Calculator</h2>

<div class="form-row">

<select id="gender">
    <option value="" disabled selected>Select Gender</option>
    <option value="man">Man</option>
    <option value="woman">Woman</option>
</select>

<input type="number" id="age" placeholder="Age">
<input type="number" id="weight" placeholder="Weight (kg)">
<input type="number" id="height" placeholder="Height (cm)">

</div>

<div class="bmr-box">
<div>BMR Calories</div>
<div class="bmr-value" id="bmrValue">--</div>
</div>

<div id="results"></div>

<div class="actions">
<button onclick="savePDF()">Save PDF</button>
<button onclick="toggleDark()">Dark</button>
</div>

</div>

<script>

const levels = [
 {
   name:"Sedentary",
   desc:"Little or no exercise",
   mult:1.2,
   class:"row1"
 },
 {
   name:"Exercise 1-3 times/week",
   desc:"Light activity",
   mult:1.37,
   class:"row2"
 },
 {
   name:"Exercise 4-5 times/week",
   desc:"Moderate activity",
   mult:1.46,
   class:"row3"
 },
 {
   name:"Daily exercise or intense exercise 3-4 times/week",
   desc:"Active lifestyle",
   mult:1.55,
   class:"row4"
 },
 {
   name:"Intense exercise 6-7 times/week",
   desc:"Very active / athlete level",
   mult:1.73,
   class:"row5"
 }
];

function format(n){
 return n.toLocaleString("de-DE")+" kcal";
}

function calculate(){

 let g=document.getElementById("gender").value;
 let a=+age.value, w=+weight.value, h=+height.value;

 if(!a||!w||!h||!g){
    reset();
    return;
 }

 let bmr = g==="man"
 ? (10*w)+(6.25*h)-(5*a)+5
 : (10*w)+(6.25*h)-(5*a)-161;

 bmr=Math.round(bmr);

 bmrValue.innerText=format(bmr);

 renderCards(bmr);
}

function renderCards(bmr){

 let html="";
 levels.forEach(l=>{
   let val=Math.round(bmr*l.mult);
   html+=`
   <div class="card ${l.class}">
        <div class="card-text">
            <strong>${l.name}</strong><br>
            ${l.desc}
        </div>
        <div class="card-value">${format(val)}</div>
   </div>`;
 });

 results.innerHTML=html;
}

function reset(){
    bmrValue.innerText="--";
    results.innerHTML="";
}

/* SAVE → opens native PDF dialog */
function savePDF(){
    window.print();
}

/* DARK MODE */
function toggleDark(){
    document.body.classList.toggle("dark");
}

/* LISTENERS */
["age","weight","height","gender"].forEach(id=>{
 document.getElementById(id).addEventListener("input",calculate);
});

</script>

</body>
</html>
