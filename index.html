<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BMR Calculator</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --base: 3.5vw;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    padding:2vw;
}

/* DARK MODE */
body.dark{
    background:#1c1c1c;
    color:#eee;
}

.container{
    width:100%;
    max-width:500px;
}

h2{
    text-align:center;
    font-size:calc(var(--base) * 1.6);
    margin-bottom:2vw;
}

.form-row{
    display:flex;
    flex-direction:column;
    gap:1.5vw;
    margin-bottom:2vw;
}

.input-line{
    display:flex;
    align-items:center;
    width:100%;
}

.input-line label{
    flex:0 0 30%;
    font-size:calc(var(--base) * 0.9);
}

/* ✅ KEY FIX HERE */
.input-line input,
.input-line select{
    flex:1;
    padding:1.5vw;
    font-size:max(16px, calc(var(--base) * 0.7)); /* prevents iPhone zoom */
    border-radius:1.5vw;
    border:1px solid #ccc;
    min-width:0;
}

.bmr-box{
    text-align:center;
    padding:3vw;
    border-radius:3vw;
    background:#fff;
    margin-bottom:2vw;
}

body.dark .bmr-box{
    background:#2c2c2c;
}

/* BMR VALUE */
.bmr-value{
    font-size:calc(var(--base) * 2);
    font-weight:bold;
    color:#336699;
    transition: color 0.3s ease;
}

/* DARK MODE COLOR */
body.dark .bmr-value{
    color:#FFD700 !important;
}

/* CARDS */

.card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:2vw;
    padding:2.5vw;
    border-radius:3vw;
    margin-bottom:1.5vw;
}

.card-text{
    flex:1;
    font-size:calc(var(--base) * 0.85);
    line-height:1.2;
}

.card-text strong{
    display:block;
    font-size:calc(var(--base) * 0.95);
}

.card-value{
    flex:0 0 auto;
    font-size:calc(var(--base) * 0.9);
    font-weight:bold;
    white-space:nowrap;
}

/* COLORS */

.row1{background:#FE7676}
.row2{background:#DAF2D0}
.row3{background:#B5E6A2}
.row4{background:#8ED973}
.row5{background:#8ED973}

/* keep readable */
body.dark .row2,
body.dark .row3{
    color:#000;
}

/* BUTTONS */

.actions{
    display:flex;
    gap:2vw;
    margin-top:2vw;
}

button{
    flex:1;
    padding:2vw;
    font-size:calc(var(--base) * 0.9);
    border:none;
    border-radius:2vw;
    background:#336699;
    color:#fff;
}

/* DESKTOP */
@media(min-width:768px){
    :root{
        --base:16px;
    }
}

</style>
</head>

<body>

<div class="container">

<h2>BMR Calculator</h2>

<div class="form-row">

<div class="input-line">
<label>Gender:</label>
<select id="gender">
<option value="" disabled selected>Select</option>
<option value="man">Man</option>
<option value="woman">Woman</option>
</select>
</div>

<div class="input-line">
<label>Age:</label>
<input type="number" id="age">
</div>

<div class="input-line">
<label>Weight:</label>
<input type="number" id="weight">
</div>

<div class="input-line">
<label>Height:</label>
<input type="number" id="height">
</div>

</div>

<div class="bmr-box">
<div>BMR Calories</div>
<div class="bmr-value" id="bmrValue">--</div>
</div>

<div id="results"></div>

<div class="actions">
<button onclick="savePDF()">Save PDF</button>
<button id="darkBtn" onclick="toggleDark()">Dark</button>
</div>

</div>

<script>

const levels = [
 {name:"Sedentary",desc:"Little or no exercise",mult:1.2,class:"row1"},
 {name:"Light: ",desc:"Exercise 1-3 times/week",mult:1.37,class:"row2"},
 {name:"Moderate",desc:"Exercise 4-5 times/week",mult:1.46,class:"row3"},
 {name:"Active",desc:"Daily or intense exercise 3-4 times/week",mult:1.55,class:"row4"},
 {name:"Intensive",desc:"Intense exercise 6-7 times/week",mult:1.73,class:"row5"}
];

function format(n){
 return n.toLocaleString("de-DE")+" kcal";
}

function calculate(){

 let g=gender.value;
 let a=+age.value,w=+weight.value,h=+height.value;

 if(!g||!a||!w||!h){ reset(); return; }

 let bmr = g==="man"
 ? (10*w)+(6.25*h)-(5*a)+5
 : (10*w)+(6.25*h)-(5*a)-161;

 bmr=Math.round(bmr);
 bmrValue.innerText=format(bmr);

 results.innerHTML=levels.map(l=>`
 <div class="card ${l.class}">
   <div class="card-text">
     <strong>${l.name}</strong>
     ${l.desc}
   </div>
   <div class="card-value">${format(Math.round(bmr*l.mult))}</div>
 </div>
 `).join("");
}

function reset(){
 bmrValue.innerText="--";
 results.innerHTML="";
}

function savePDF(){
    window.print();
}

function toggleDark(){

    document.body.classList.toggle("dark");

    const btn = document.getElementById("darkBtn");
    const isDark = document.body.classList.contains("dark");

    btn.innerText = isDark ? "Light" : "Dark";

    const bmr = document.getElementById("bmrValue");
    bmr.style.color = isDark ? "#FFD700" : "#336699";
}

["age","weight","height","gender"].forEach(id=>{
 document.getElementById(id).addEventListener("input",calculate);
});

</script>

</body>
</html>
