<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BMR Calculator</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f6f9;
    padding:15px;
}

/* CONTAINER */

.container{
    max-width:600px;
    margin:auto;
}

/* TITLE */

h2{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

/* INPUTS */

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:20px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

label{
    font-size:13px;
    margin-bottom:5px;
    font-weight:bold;
}

input, select{
    padding:12px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:14px;
}

/* BMR CARD */

.bmr-card{
    background:#fff;
    border-radius:20px;
    padding:25px;
    text-align:center;
    margin-bottom:20px;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
    transition:0.3s;
}

.bmr-value{
    font-size:40px;
    font-weight:bold;
    color:#336699;
}

/* RESULT CARDS */

.cards{
    display:flex;
    flex-direction:column;
    gap:12px;
}

/* CARD BASE */

.card{
    padding:15px;
    border-radius:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:14px;
    transition:0.3s;
    transform:scale(1);
}

/* HOVER EFFECT (Desktop bonus) */
.card:hover{
    transform:scale(1.02);
}

/* COLORS (UNCHANGED FROM YOU) */

.row1{ background:#FE7676; }
.row2{ background:#DAF2D0; }
.row3{ background:#B5E6A2; }
.row4{ background:#8ED973; }
.row5{ background:#8ED973; }

/* TEXT */

.card span:last-child{
    font-weight:bold;
    font-size:16px;
}

/* ACTION BUTTONS */

.actions{
    margin-top:20px;
    display:flex;
    gap:10px;
}

button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#336699;
    color:#fff;
    font-size:14px;
    cursor:pointer;
}

button:active{
    transform:scale(0.96);
}

</style>
</head>

<body>

<div class="container">

    <h2>BMR Calculator</h2>

    <div class="form-row">

        <div class="form-group">
            <label>Gender</label>
            <select id="gender">
                <option value="man">Man</option>
                <option value="woman">Woman</option>
            </select>
        </div>

        <div class="form-group">
            <label>Age</label>
            <input type="number" id="age">
        </div>

        <div class="form-group">
            <label>Weight (kg)</label>
            <input type="number" id="weight">
        </div>

        <div class="form-group">
            <label>Height (cm)</label>
            <input type="number" id="height">
        </div>

    </div>

    <!-- BMR DISPLAY -->

    <div class="bmr-card">
        <div>BMR Calories</div>
        <div class="bmr-value" id="bmrValue">--</div>
    </div>

    <!-- RESULTS -->

    <div class="cards">

        <div class="card row1">
            <span>Sedentary</span>
            <span id="r1">--</span>
        </div>

        <div class="card row2">
            <span>Exercise 1-3x/week</span>
            <span id="r2">--</span>
        </div>

        <div class="card row3">
            <span>Exercise 4-5x/week</span>
            <span id="r3">--</span>
        </div>

        <div class="card row4">
            <span>Daily exercise</span>
            <span id="r4">--</span>
        </div>

        <div class="card row5">
            <span>Intense 6-7x/week</span>
            <span id="r5">--</span>
        </div>

    </div>

    <!-- ACTIONS -->

    <div class="actions">
        <button onclick="saveResult()">Save</button>
        <button onclick="shareResult()">Share</button>
    </div>

</div>

<script>

function formatNumber(number){
    return number.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

function calculateBMR(){

    let gender = document.getElementById("gender").value;
    let age = document.getElementById("age").value;
    let weight = document.getElementById("weight").value;
    let height = document.getElementById("height").value;

    if(!age || !weight || !height){
        resetValues();
        return;
    }

    age = parseFloat(age);
    weight = parseFloat(weight);
    height = parseFloat(height);

    let bmr = gender === "man"
        ? (10 * weight) + (6.25 * height) - (5 * age) + 5
        : (10 * weight) + (6.25 * height) - (5 * age) - 161;

    bmr = Math.round(bmr);

    animateValue("bmrValue", bmr);
    setValue("r1", bmr * 1.20);
    setValue("r2", bmr * 1.37);
    setValue("r3", bmr * 1.46);
    setValue("r4", bmr * 1.55);
    setValue("r5", bmr * 1.73);
}

function setValue(id, val){
    document.getElementById(id).innerText =
        formatNumber(Math.round(val)) + " kcal";
}

/* SMOOTH NUMBER ANIMATION */

function animateValue(id, value){

    let el = document.getElementById(id);
    let start = 0;
    let duration = 400;
    let startTime = null;

    function animation(currentTime){
        if(!startTime) startTime = currentTime;
        let progress = Math.min((currentTime - startTime)/duration, 1);
        let val = Math.floor(progress * value);

        el.innerText = formatNumber(val) + " kcal";

        if(progress < 1){
            requestAnimationFrame(animation);
        }
    }

    requestAnimationFrame(animation);
}

function resetValues(){
    document.getElementById("bmrValue").innerText = "--";
    ["r1","r2","r3","r4","r5"].forEach(id=>{
        document.getElementById(id).innerText="--";
    });
}

/* SAVE */

function saveResult(){
    let data = {
        bmr: document.getElementById("bmrValue").innerText,
        r1: document.getElementById("r1").innerText,
        r2: document.getElementById("r2").innerText,
        r3: document.getElementById("r3").innerText,
        r4: document.getElementById("r4").innerText,
        r5: document.getElementById("r5").innerText
    };
    localStorage.setItem("bmrData", JSON.stringify(data));
    alert("Saved!");
}

/* SHARE */

function shareResult(){

    let text = `
BMR: ${document.getElementById("bmrValue").innerText}
Sedentary: ${document.getElementById("r1").innerText}
1-3x/week: ${document.getElementById("r2").innerText}
4-5x/week: ${document.getElementById("r3").innerText}
Daily: ${document.getElementById("r4").innerText}
Intense: ${document.getElementById("r5").innerText}
`;

    if(navigator.share){
        navigator.share({title:"BMR Result", text:text});
    }else{
        alert(text);
    }
}

/* LISTENERS */

["age","weight","height","gender"].forEach(id=>{
    document.getElementById(id).addEventListener("input", calculateBMR);
});

resetValues();

</script>

</body>
</html>
